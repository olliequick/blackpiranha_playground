name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install site dependencies
        run: python -m pip install -r requirements.txt

      - name: Build root portal and mini-sites
        run: |
          # 1. Initialize clean site output directory
          rm -rf site
          mkdir -p site

          # 2. Copy root portal files into site/
          cp index.html site/
          cp style.css site/
          cp CNAME site/
          touch site/.nojekyll
          if [ -d "assets" ]; then cp -r assets site/; fi
          if [ -f "privacy.html" ]; then cp privacy.html site/; fi
          if [ -f "releases.js" ]; then cp releases.js site/; fi
          if [ -f "sparrowhawk_blue_whiteback.png" ]; then cp sparrowhawk_blue_whiteback.png site/; fi

          # 3. Discover and build each subfolder mini-site
          for config in */mkdocs.yml; do
            if [ -f "$config" ]; then
              project=$(dirname "$config")
              echo "==> Building mini-site for: $project"
              mkdocs build -f "$config" -d "../site/$project" --strict
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4