<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackpiranha</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 56px;
        }
        .logo-container img {
            max-width: 220px;
            height: auto;
        }
        .app-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .app-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #111111;
            border: 1px solid #222222;
            border-radius: 12px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .app-row:hover {
            background: #181818;
            border-color: #333333;
        }
        .app-link {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: inherit;
        }
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            background: #222;
        }
        .app-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
        }
        .app-link:hover .app-name {
            color: #38bdf8;
        }
        .app-desc {
            font-size: 0.9rem;
            color: #9ca3af;
            text-align: right;
            max-width: 320px;
            margin-left: 16px;
        }
        @media (max-width: 650px) {
            .app-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .app-desc {
                text-align: left;
                max-width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="assets/blackpiranha_playground_blackbg.jpg" alt="Blackpiranha">
        </div>

        <div class="app-list">
            <div class="app-row">
                <a href="sparrowhawk/" class="app-link">
                    <img src="assets/logo_sparrowhawk.png" alt="Sparrowhawk" class="app-icon">
                    <span class="app-name">Sparrowhawk</span>
                </a>
                <div class="app-desc">A modern, privacy-first RSS reader for Android.</div>
            </div>

            <div class="app-row">
                <a href="eat-what-ah/" class="app-link">
                    <img src="assets/logo_eatwhatah.png" alt="Eat What Ah" class="app-icon">
                    <span class="app-name">Eat What Ah</span>
                </a>
                <div class="app-desc">A lightweight food companion app to decide what to eat.</div>
            </div>

            <div class="app-row">
                <a href="type-affair/" class="app-link">
                    <img src="assets/logo_typeaffair.png" alt="Type Affair" class="app-icon">
                    <span class="app-name">Type Affair</span>
                </a>
                <div class="app-desc">A font testing and typography inspection tool for Android.</div>
            </div>

            <div class="app-row">
                <a href="wherebus/" class="app-link">
                    <img src="assets/logo_wherebus.png" alt="WhereBus" class="app-icon">
                    <span class="app-name">WhereBus</span>
                </a>
                <div class="app-desc">A large-display bus arrival dashboard for tablets and devices.</div>
            </div>
        </div>
    </div>
</body>
</html>
